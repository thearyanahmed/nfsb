global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # scrape from staging nfsb app (gvisor environment)
  - job_name: 'nfsb-staging'
    scheme: https
    static_configs:
      - targets: ['nfsb-c4skh.onstagingocean.app']
    metrics_path: /metrics
    # relabel to add environment info
    relabel_configs:
      - source_labels: [__address__]
        target_label: environment
        replacement: staging
