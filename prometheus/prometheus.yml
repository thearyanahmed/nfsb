global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # scrape nfsb on App Platform
  # REPLACE with your app's URL (e.g., nfsb-xxxxx.ondigitalocean.app)
  - job_name: 'nfsb'
    static_configs:
      - targets: ['app-without-gvisor-gqteg.onstagingocean.app', 'app-with-gvisor-iyp8d.onstagingocean.app']
    scheme: https
    scrape_interval: 5s
    metrics_path: /metrics
