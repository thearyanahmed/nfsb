[package]
name = "nfsb"
version = "0.2.0"
edition = "2021"
description = "NFS benchmark tool for DigitalOcean App Platform"
authors = ["DigitalOcean App Platform Team"]

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# REST API
axum = { version = "0.7", features = ["json", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Metrics
prometheus = "0.13"
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.5"

# Random data
rand = "0.8"

# Progress bars
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# System info
sysinfo = "0.30"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
